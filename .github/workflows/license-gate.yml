name: License Gate

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate manifests
        run: |
          node scripts/validate_manifest.mjs manifests/runtime-index.json
          test -f manifests/runtime-index.stable.json && node scripts/validate_manifest.mjs manifests/runtime-index.stable.json || true
          test -f manifests/runtime-index.candidate.json && node scripts/validate_manifest.mjs manifests/runtime-index.candidate.json || true
      - name: Run license gate
        run: node scripts/license_gate.mjs manifests
