name: Runtime Update

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

jobs:
  update-runtime-registry:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check upstream tags
        run: node scripts/check_upstream_versions.mjs manifests/runtime-sources.json
      - name: Build manifests
        run: node scripts/build_runtime_index.mjs --channels stable,candidate
      - name: Validate manifests
        run: |
          node scripts/validate_manifest.mjs manifests/runtime-index.stable.json
          node scripts/validate_manifest.mjs manifests/runtime-index.candidate.json
      - name: License gate
        run: node scripts/license_gate.mjs manifests
      - name: Create PR with updates
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/runtime-registry-update
          commit-message: "chore: update runtime registry manifests"
          title: "chore: runtime registry update"
          body: |
            Automated update:
            - upstream tag scan
            - manifest rebuild (stable/candidate)
            - validation + license gates
          labels: |
            runtime
            automation
      - name: Enable auto-merge
        if: ${{ steps.cpr.outputs.pull-request-number }}
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: squash
