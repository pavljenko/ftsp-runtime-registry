name: Runtime Update

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

jobs:
  update-runtime-registry:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check upstream tags
        run: node scripts/check_upstream_versions.mjs manifests/runtime-sources.json

      - name: Set release tag
        run: node scripts/set_release_tag.mjs manifests/runtime-sources.json

      - name: Build runtime assets
        run: node scripts/build_engine_assets.mjs manifests/runtime-sources.json --strict-fetch

      - name: Build manifests
        run: node scripts/build_runtime_index.mjs --channels stable,candidate
        env:
          FTSP_RUNTIME_SIGNING_PRIVATE_KEY_B64: ${{ secrets.FTSP_RUNTIME_SIGNING_PRIVATE_KEY_B64 }}

      - name: Validate manifests
        run: |
          node scripts/validate_manifest.mjs manifests/runtime-index.stable.json
          node scripts/validate_manifest.mjs manifests/runtime-index.candidate.json

      - name: License gate
        run: node scripts/license_gate.mjs manifests

      - name: Runtime smoke gate
        run: node scripts/runtime_smoke_gate.mjs

      - name: Create PR with updates
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/runtime-registry-update
          commit-message: "chore: update runtime registry assets and manifests"
          title: "chore: runtime registry auto-update"
          body: |
            Automated update:
            - upstream tag scan
            - runtime assets refresh
            - manifest rebuild (stable/candidate)
            - validation + license/smoke gates
          labels: |
            runtime
            automation

      - name: Enable auto-merge
        if: ${{ steps.cpr.outputs.pull-request-number }}
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: squash
