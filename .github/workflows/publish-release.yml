name: Publish Runtime Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - 'main'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve release tag
        id: meta
        run: |
          TAG=$(node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('manifests/runtime-sources.json','utf8'));process.stdout.write(String(s.releaseTag||''));")
          if [ -z "$TAG" ]; then
            echo "releaseTag is empty" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build runtime assets
        run: node scripts/build_engine_assets.mjs manifests/runtime-sources.json --strict-fetch

      - name: Build manifests
        run: node scripts/build_runtime_index.mjs --channels stable,candidate
        env:
          FTSP_RUNTIME_SIGNING_PRIVATE_KEY_B64: ${{ secrets.FTSP_RUNTIME_SIGNING_PRIVATE_KEY_B64 }}

      - name: Validate manifests
        run: |
          node scripts/validate_manifest.mjs manifests/runtime-index.stable.json
          node scripts/validate_manifest.mjs manifests/runtime-index.candidate.json
          node scripts/license_gate.mjs manifests
          node scripts/runtime_smoke_gate.mjs

      - name: Collect release assets
        run: |
          rm -rf dist
          node scripts/collect_release_assets.mjs dist

      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: |
            dist/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

      - name: Publish stable channel alias
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stable
          name: Runtime Stable Channel
          files: |
            dist/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: false
